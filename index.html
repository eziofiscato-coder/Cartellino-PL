<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controllo Timbrature</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;margin:0;background:#f5f5f5}
.header{background:white;padding:12px 20px;border-bottom:2px solid #0078d7;font-weight:bold;color:#0078d7}
table{border-collapse:collapse;width:100%;background:white}
th{background:#d9d9d9;padding:6px;font-size:12px;border:1px solid #ccc}
td{border:1px solid #ddd;padding:2px;text-align:center;font-size:13px}
tr:nth-child(even){background:#f2f2f2}
.dom{color:red;font-weight:bold}
input{width:90%;border:none;text-align:center;padding:4px;background:transparent}
input:focus{background:#fff3cd;outline:1px solid #0078d7}
.tot{background:#d9d9d9;font-weight:bold}
</style></head>
<body>
<div class="header">✓ Dati Giornalieri &nbsp; Dati Periodo</div>
<div style="overflow:auto;padding:10px">
<table id="tab"><thead><tr>
<th>GIO.</th><th>MOD.</th><th>E</th><th>U</th><th>E</th><th>U</th><th>DOV</th><th>EFF</th><th>-/+</th><th>STR</th><th>TURNO</th><th>B.P.</th><th>GIUSTIFICATIVI</th>
</tr></thead><tbody id="body"></tbody></table>
</div>
<script>
const GIO=["01 G","02 V","03 S","04 D","05 L","06 M","07 M","08 G","09 V","10 S","11 D","12 L","13 M","14 M","15 G","16 V","17 S","18 D","19 L","20 M","21 M","22 G","23 V","24 S","25 D","26 L","27 M","28 M","29 G","30 V","31 S"];
const MOD=GIO.map(g=>g.includes(" D")?"PMFSNL":"PM001");
const tbody=document.getElementById("body");
GIO.forEach((g,i)=>{
  const tr=document.createElement("tr");
  const isDom=g.includes(" D");
  tr.innerHTML=`<td class="${isDom?"dom":""}">${g}</td><td>${MOD[i]}</td>` + 
  Array(11).fill(0).map((_,j)=>`<td><input value="${i==0&&j==0?"06:52":""}" placeholder="--:--"></td>`).join("");
  tbody.appendChild(tr);
});
const trTot=document.createElement("tr");
trTot.innerHTML=`<td colspan="2" class="tot"></td>` + `<td class="tot"></td>`.repeat(4) + `<td class="tot">0,00</td>`.repeat(6) + `<td class="tot"></td>`;
tbody.appendChild(trTot);
</script>
</body></html>
